# ---- 内存 ----
# 2G 对 Kotlin + AGP 偏小，容易触发 GC 抖动；CI 机器通常有 7G+
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Kotlin 编译守护进程单独给内存，避免和 Gradle 抢
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ---- 构建缓存 / 并行 ----
org.gradle.caching=true
org.gradle.parallel=true
# 无 TTY 时用纯文本输出，日志里能看到一行行任务名（CI 友好）
org.gradle.console=plain
org.gradle.logging.stacktrace=full
# 只打印必要的告警，减少刷屏
org.gradle.warning.mode=summary

# 配置缓存：AGP 8.5 已基本支持，若遇到 "Configuration cache problems" 改成 false
org.gradle.configuration-cache=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
# 只构建需要的资源语言 / 密度，缩短打包时间
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# ---- Kotlin ----
kotlin.code.style=official
# 增量编译与编译守护进程复用
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon

# 命令行工具是纯 C 实现（native/），用 make + NDK 构建，不经过 Gradle，
# 也不需要 Kotlin/Native 工具链。
