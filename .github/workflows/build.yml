name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      - name: Assemble
        run: |
          /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleDebug
          /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BootForge-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BootForge-release-unsigned.apk
          else
            cp app/build/outputs/apk/release/app-release.apk artifacts/BootForge-release.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BootForge-apk
          path: artifacts/*
          if-no-files-found: error

  cli-x64:
    name: CLI (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle

      - name: Build static binary
        run: /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :cli:linkBootforgeReleaseExecutableLinuxX64

      - name: Collect
        run: |
          mkdir -p artifacts
          BIN=$(find cli/build -type f -name 'bootforge.kexe' | head -1)
          if [ -z "$BIN" ]; then
            echo "未找到产物"; find cli/build -maxdepth 4 -type f | head -40; exit 1
          fi
          cp "$BIN" artifacts/bootforge-linux-x86_64
          chmod +x artifacts/bootforge-linux-x86_64
          file artifacts/bootforge-linux-x86_64 || true
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bootforge-linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  cli-arm64:
    name: CLI (linux-aarch64 / Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Build inside an aarch64 container
        run: |
          set -e
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src arm64v8/ubuntu:22.04 bash -lc '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq openjdk-17-jdk-headless unzip curl ca-certificates libc6-dev
            if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
              curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
              unzip -q /tmp/gradle.zip -d /opt
            fi
            GRADLE=/opt/gradle-8.9/bin/gradle
            $GRADLE --no-daemon --stacktrace :cli:linkBootforgeReleaseExecutableLinuxArm64
          '

      - name: Collect
        run: |
          set -e
          mkdir -p artifacts
          BIN=$(find cli/build -type f -name 'bootforge.kexe' | head -1)
          if [ -z "$BIN" ]; then
            echo "未找到产物"; find cli/build -maxdepth 4 -type f | head -40; exit 1
          fi
          cp "$BIN" artifacts/bootforge-linux-aarch64
          chmod +x artifacts/bootforge-linux-aarch64
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bootforge-linux-aarch64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [apk, cli-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
