name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_cli:
        description: "是否构建命令行二进制（耗时较长）"
        type: boolean
        default: true

env:
  GRADLE: /opt/gradle-8.9/bin/gradle

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      # 一次调用打两个包：只经历一次配置阶段，比两次调用快很多
      - name: Assemble
        run: $GRADLE --console=plain :app:assembleDebug :app:assembleRelease

      - name: Collect
        run: |
          set -e
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BootForge-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BootForge-release-unsigned.apk
          else
            cp app/build/outputs/apk/release/app-release.apk artifacts/BootForge-release.apk
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: BootForge-apk
          path: artifacts/*
          if-no-files-found: error

  cli:
    # 纯 C 实现，用 NDK 交叉编译，跟 magiskboot 一样的路子。
    # 不需要 1 GB 的 Kotlin/Native 工具链，全程几十秒。
    name: CLI (x86_64 + aarch64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - name: Build for this host (x86_64, static)
        working-directory: native
        run: make static

      - name: Smoke test on host
        working-directory: native
        run: sh test/run.sh

      - name: Collect x86_64
        run: |
          mkdir -p artifacts
          cp native/build/bootforge artifacts/bootforge-linux-x86_64
          chmod +x artifacts/bootforge-linux-x86_64

      - name: Install Android NDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" | tail -3

      # 动态链接版：由 /system/bin/linker64 加载，不受 bionic 的 TLS 对齐检查影响
      - name: Cross compile aarch64 (dynamic, recommended)
        working-directory: native
        run: make android ANDROID_NDK_HOME=$NDK_HOME

      - name: Collect aarch64
        run: |
          set -e
          cp native/build/bootforge artifacts/bootforge-android-aarch64
          chmod +x artifacts/bootforge-android-aarch64
          file artifacts/bootforge-android-aarch64 || true

      - name: Cross compile armv7 (dynamic)
        working-directory: native
        run: make android-arm ANDROID_NDK_HOME=$NDK_HOME

      - name: Collect armv7
        run: |
          set -e
          cp native/build/bootforge artifacts/bootforge-android-armv7
          chmod +x artifacts/bootforge-android-armv7
          file artifacts/bootforge-android-armv7 || true

      # 静态版作为备选：部分设备会报 TLS 段对齐不足
      - name: Cross compile aarch64 (static, fallback)
        working-directory: native
        run: make android-static ANDROID_NDK_HOME=$NDK_HOME

      - name: Collect aarch64 static
        run: |
          set -e
          cp native/build/bootforge artifacts/bootforge-android-aarch64-static
          chmod +x artifacts/bootforge-android-aarch64-static
          file artifacts/bootforge-android-aarch64-static || true

      - uses: actions/upload-artifact@v4
        with:
          name: bootforge-cli
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [apk, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
