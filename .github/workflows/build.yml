name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest 镜像已内置 Android SDK（含 licenses 与 build-tools）
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          ls -1 "$ANDROID_HOME/licenses"
          ls -1 "$ANDROID_HOME" | head -20

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -5

      - name: Assemble Debug
        run: /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Assemble Release
        run: /opt/gradle-8.9/bin/gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BootForge-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BootForge-release-unsigned.apk
          else
            cp app/build/outputs/apk/release/app-release.apk artifacts/BootForge-release.apk
          fi
          ls -lh artifacts

      - name: Optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置签名密钥（KEYSTORE_BASE64），跳过签名步骤"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/bootforge.jks
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "未找到 apksigner，跳过签名"
          else
            SRC=$(ls artifacts/BootForge-release*.apk | head -1)
            "$APKSIGNER" sign --ks /tmp/bootforge.jks \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out artifacts/BootForge-release-signed.apk "$SRC"
            rm -f "$SRC"
          fi
          rm -f /tmp/bootforge.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BootForge-apk
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: BootForge-apk
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
