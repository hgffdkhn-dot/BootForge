name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_cli:
        description: "是否构建命令行二进制（耗时较长）"
        type: boolean
        default: true

env:
  GRADLE: /opt/gradle-8.9/bin/gradle

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      # 一次调用打两个包：只经历一次配置阶段，比两次调用快很多
      - name: Assemble
        run: $GRADLE --console=plain :app:assembleDebug :app:assembleRelease

      - name: Collect
        run: |
          set -e
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BootForge-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BootForge-release-unsigned.apk
          else
            cp app/build/outputs/apk/release/app-release.apk artifacts/BootForge-release.apk
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: BootForge-apk
          path: artifacts/*
          if-no-files-found: error

  cli:
    # Kotlin/Native 是交叉编译器：在 x64 主机上可以直接产出 aarch64 二进制，
    # 不需要 ARM runner，也不需要 QEMU。
    # 注意：Kotlin 1.9.x 没有 linux-aarch64 版本的编译器预编译包
    # （kotlin-native-prebuilt-linux-aarch64），所以不能在 ARM runner 上构建。
    name: CLI (x86_64 + aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # Kotlin/Native 工具链（konan）约 1 GB，缓存后能省掉几分钟下载
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts', 'cli/build.gradle.kts', 'gradle.properties') }}
          restore-keys: konan-${{ runner.os }}-

      # 兜底：直接从 GitHub Releases 拉取预编译包，解开到插件期望的目录
      # （~/.konan/kotlin-native-prebuilt-linux-x86_64-<版本>），命中后插件就不再下载。
      # 这一步只做"准备好工具链"，失败也不影响后续由插件自行下载。
      - name: Prepare Kotlin/Native toolchain
        run: |
          set -e
          VER=1.9.24
          DIR="$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-$VER"
          if [ -x "$DIR/bin/kotlinc-native" ]; then
            echo "已有工具链: $DIR"
          else
            echo "预下载 konan $VER ..."
            mkdir -p "$HOME/.konan"
            if curl -fL --retry 3 --retry-delay 5 \
                 -o /tmp/konan.tar.gz \
                 "https://github.com/JetBrains/kotlin/releases/download/v$VER/kotlin-native-prebuilt-linux-x86_64-$VER.tar.gz"; then
              tar -xzf /tmp/konan.tar.gz -C "$HOME/.konan"
            else
              echo "预下载失败，交给 Gradle 自行下载"
            fi
          fi
          if [ -x "$DIR/bin/kotlinc-native" ]; then
            echo "KONAN_HOME=$DIR" >> "$GITHUB_ENV"
          fi
          ls -1 "$HOME/.konan" || true

      - name: Install Gradle 8.9
        run: |
          set -e
          if [ ! -x /opt/gradle-8.9/bin/gradle ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      # 一次调用产出两个架构：只经历一次配置阶段，且共用同一份已下载的 konan
      # 网络下载偶发失败，重试一次
      - name: Build x86_64 + aarch64 binaries
        run: |
          set -e
          EXTRA=""
          if [ -n "${KONAN_HOME:-}" ]; then EXTRA="-Pkotlin.native.home=$KONAN_HOME"; fi
          for i in 1 2; do
            echo "=== 第 $i 次构建 ==="
            if $GRADLE --console=plain $EXTRA -PbootforgeStatic=false \
                 :cli:linkBootforgeReleaseExecutableLinuxX64 \
                 :cli:linkBootforgeReleaseExecutableLinuxArm64; then
              exit 0
            fi
            echo "构建失败，15 秒后重试"
            sleep 15
          done
          exit 1

      - name: Collect
        run: |
          set -e
          mkdir -p artifacts

          X64=$(find cli/build -path '*linuxX64*' -type f -name 'bootforge.kexe' | head -1)
          ARM=$(find cli/build -path '*linuxArm64*' -type f -name 'bootforge.kexe' | head -1)

          if [ -z "$X64" ] || [ -z "$ARM" ]; then
            echo "产物不完整: x64='$X64' arm64='$ARM'"
            find cli/build -maxdepth 5 -type f -name '*.kexe' | head -20
            exit 1
          fi

          cp "$X64" artifacts/bootforge-linux-x86_64
          cp "$ARM" artifacts/bootforge-linux-aarch64
          chmod +x artifacts/bootforge-*
          file artifacts/bootforge-linux-aarch64 || true
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: bootforge-cli
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [apk, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
